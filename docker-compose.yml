services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fairdrop
      POSTGRES_PASSWORD: fairdrop
      POSTGRES_DB: fairdrop
    ports: ["5432:5432"]
    command: ["postgres", "-c", "max_connections=200"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
